name: model-results-check
on:
  push:
    branches: ['wip/model-results-check']
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/model-results/precompute.js out --leagues=nfl,nba --minutes=10
      - uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: frontend/out/model-results
